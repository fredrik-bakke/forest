name: Deploy to GitHub Pages

env:
  FORESTER_VERSION: "6.0"
  OCAML_VERSION: "5.4.0"

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - "LICENSES/**"
      - "README.md"
      - "CITATION.cff"
      - "**/.gitignore"
      - ".vscode/**"

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
      - name: Configure hosting
        uses: actions/configure-pages@v6
      - name: Set up LaTeX
        uses: TeX-Live/setup-texlive-action@v4
        with:
          # Avoid restoring the old full distribution through a fallback cache key.
          texdir: ${{ runner.temp }}/texlive-minimal
          # `packages` must list all LaTeX packages in latex-preamble.tree
          packages: |
            scheme-basic
            standalone
            pgf
            tikz-cd
            quiver
            spath3
            tikz-nfold
            babel
            mathtools
            amsfonts
            stmaryrd
            bbold
            bbold-type1
            mathpartir
            lkproof

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dvisvgm xsltproc
      - name: Identify runner
        id: toolchain
        run: echo "os=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"
      - name: Restore Forester cache
        id: forester-cache
        uses: actions/cache/restore@v6
        with:
          path: _opam
          key: forester-${{ runner.os }}-${{ steps.toolchain.outputs.os }}-${{ runner.arch }}-ocaml-${{ env.OCAML_VERSION }}-${{ env.FORESTER_VERSION }}
          # Reuse the installation already saved by the previous workflow.
          restore-keys: forester-${{ runner.os }}-${{ steps.toolchain.outputs.os }}-${{ runner.arch }}-opam-2.6.1-ocaml-${{ env.OCAML_VERSION }}-${{ env.FORESTER_VERSION }}
      - name: Set up OCaml
        if: steps.forester-cache.outputs.cache-matched-key == ''
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - name: Install Forester
        if: steps.forester-cache.outputs.cache-matched-key == ''
        run: |
          opam pin add --switch=. forester "git+https://tangled.org/jonmsterling.com/ocaml-forester#${{ env.FORESTER_VERSION }}" --yes
          opam exec --switch=. -- forester --version
      # Preserve a successful install even when the later site build fails.
      - name: Save Forester cache
        if: steps.forester-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: _opam
          key: ${{ steps.forester-cache.outputs.cache-primary-key }}

      - name: Build site
        run: |
          make build
          chmod -R a+rX output/forest

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output/forest
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
