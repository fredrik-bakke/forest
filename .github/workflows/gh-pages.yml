name: Deploy to GitHub Pages

env:
  FORESTER_VERSION: "6.0"
  OCAML_VERSION: "5.4.0"

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - "LICENSES/**"
      - "README.md"
      - "CITATION.cff"
      - "**/.gitignore"
      - ".vscode/**"
      - "clean.sh"
      - "watch.sh"

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: scheme-full

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dvisvgm
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Identify Forester toolchain
        id: toolchain
        run: |
          echo "os=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"
          echo "opam=$(opam --version)" >> "$GITHUB_OUTPUT"
      # setup-ocaml caches the compiler, but not packages installed afterwards.
      - name: Cache Forester
        id: forester-cache
        uses: actions/cache@v6
        with:
          path: _opam
          key: forester-${{ runner.os }}-${{ steps.toolchain.outputs.os }}-${{ runner.arch }}-opam-${{ steps.toolchain.outputs.opam }}-ocaml-${{ env.OCAML_VERSION }}-${{ env.FORESTER_VERSION }}-${{ hashFiles('.github/workflows/gh-pages.yml') }}
      - name: Install Forester
        if: steps.forester-cache.outputs.cache-hit != 'true'
        run: opam pin add forester "git+https://tangled.org/jonmsterling.com/ocaml-forester#${{ env.FORESTER_VERSION }}" --yes

      - name: Build
        run: |
          # A restored switch still needs its system libraries on a fresh runner.
          opam install --switch=. --depext-only forester --yes
          ./build.sh
          chmod -R a+rX output/forest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./output/forest
      - id: deployment
        uses: actions/deploy-pages@v5
